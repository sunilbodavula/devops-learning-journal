services:
  app1:
    build: ./app
    environment:
      INSTANCE_NAME: node-1
  
  app2:
    build: ./app
    environment:
      INSTANCE_NAME: node-2
  
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2